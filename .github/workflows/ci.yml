name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backend/manage.py check
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest backend --cov=backend/alerts --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alerts-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alerts-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: "true"
